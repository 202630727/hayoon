<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘 뭐 먹지? | 점심 메뉴 추천</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts (Noto Sans KR) -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
    }
    .slot-animation {
      animation: slotBounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes slotBounce {
      0% { transform: scale(0.8); opacity: 0.5; }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-gradient-to-r from-orange-500 via-amber-500 to-yellow-500 text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('random')">
        <div class="bg-white/20 p-2.5 rounded-2xl backdrop-blur-md">
          <i class="fa-solid font-bold fa-utensils text-2xl"></i>
        </div>
        <div>
          <h1 class="font-black text-xl md:text-2xl tracking-tight leading-none">오늘 뭐 먹지?</h1>
          <p class="text-xs text-orange-100 font-medium mt-1">오늘의 점심 메뉴 완벽 추천</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <main class="max-w-4xl mx-auto px-4 mt-6">
    <nav class="flex bg-slate-200/80 p-1.5 rounded-2xl mb-6 shadow-inner">
      <button id="tab-random" onclick="switchTab('random')" class="flex-1 py-3 font-bold text-sm md:text-base rounded-xl transition-all duration-200 bg-white text-orange-600 shadow-md flex items-center justify-center space-x-2">
        <i class="fa-solid fa-dice text-lg"></i>
        <span>랜덤 추천</span>
      </button>
      <button id="tab-worldcup" onclick="switchTab('worldcup')" class="flex-1 py-3 font-bold text-sm md:text-base rounded-xl transition-all duration-200 text-slate-600 hover:text-slate-900 flex items-center justify-center space-x-2">
        <i class="fa-solid fa-trophy text-lg text-yellow-500"></i>
        <span>이상형 월드컵</span>
      </button>
      <button id="tab-manage" onclick="switchTab('manage')" class="flex-1 py-3 font-bold text-sm md:text-base rounded-xl transition-all duration-200 text-slate-600 hover:text-slate-900 flex items-center justify-center space-x-2">
        <i class="fa-solid fa-list-check text-lg"></i>
        <span>메뉴 관리</span>
      </button>
    </nav>

    <!-- SECTION 1: RANDOM PICKER -->
    <section id="sec-random" class="space-y-6">
      
      <!-- Filters -->
      <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
        <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3">필터 설정</h3>
        
        <!-- Category Filter -->
        <div class="mb-4">
          <p class="text-xs font-semibold text-slate-500 mb-2">카테고리</p>
          <div id="category-filters" class="flex flex-wrap gap-2">
            <!-- Buttons generated by JS -->
          </div>
        </div>

        <!-- Tag Filter -->
        <div>
          <p class="text-xs font-semibold text-slate-500 mb-2">상황 / 기분</p>
          <div id="tag-filters" class="flex flex-wrap gap-2">
            <!-- Buttons generated by JS -->
          </div>
        </div>
      </div>

      <!-- Result Card Display -->
      <div class="bg-white p-6 md:p-8 rounded-3xl shadow-md border border-slate-100 text-center relative overflow-hidden">
        <div id="slot-display" class="py-6 transition-all">
          <div id="slot-icon" class="text-7xl md:text-8xl mb-4">🍱</div>
          <h2 id="slot-name" class="text-3xl md:text-4xl font-extrabold text-slate-800 tracking-tight">
            버튼을 눌러 추천받으세요!
          </h2>
          <p id="slot-desc" class="text-slate-500 mt-2 font-medium">오늘 점심 고민 끝!</p>
          
          <div id="slot-details" class="hidden mt-6 pt-6 border-t border-slate-100 grid grid-cols-2 md:grid-cols-3 gap-3">
            <div class="bg-orange-50 p-3 rounded-2xl">
              <span class="text-xs text-orange-500 font-bold block">카테고리</span>
              <span id="detail-category" class="font-bold text-orange-900 text-sm md:text-base">-</span>
            </div>
            <div class="bg-amber-50 p-3 rounded-2xl">
              <span class="text-xs text-amber-500 font-bold block">평균 가격</span>
              <span id="detail-price" class="font-bold text-amber-900 text-sm md:text-base">-</span>
            </div>
            <div class="bg-emerald-50 p-3 rounded-2xl col-span-2 md:col-span-1">
              <span class="text-xs text-emerald-500 font-bold block">추천 이유</span>
              <span id="detail-tag" class="font-bold text-emerald-900 text-sm md:text-base">-</span>
            </div>
          </div>

          <!-- Map Links -->
          <div id="map-links" class="hidden mt-6 flex justify-center space-x-3">
            <a id="link-naver" href="#" target="_blank" class="flex-1 max-w-[160px] bg-emerald-500 hover:bg-emerald-600 text-white py-2.5 px-4 rounded-xl text-sm font-bold flex items-center justify-center space-x-2 transition">
              <span>네이버 지도</span>
              <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
            </a>
            <a id="link-kakao" href="#" target="_blank" class="flex-1 max-w-[160px] bg-yellow-400 hover:bg-yellow-500 text-slate-900 py-2.5 px-4 rounded-xl text-sm font-bold flex items-center justify-center space-x-2 transition">
              <span>카카오 맵</span>
              <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
            </a>
          </div>
        </div>

        <!-- Action Button -->
        <button id="btn-spin" onclick="spinSlot()" class="w-full mt-4 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-black text-xl py-4 rounded-2xl shadow-lg shadow-orange-500/30 active:scale-95 transition-all flex items-center justify-center space-x-3">
          <i class="fa-solid fa-arrows-rotate text-2xl" id="spin-icon"></i>
          <span>오늘의 점심 뽑기!</span>
        </button>
      </div>
    </section>

    <!-- SECTION 2: MENU WORLDCUP -->
    <section id="sec-worldcup" class="hidden space-y-6">
      <div class="bg-white p-6 md:p-8 rounded-3xl shadow-md border border-slate-100 text-center">
        
        <!-- Worldcup Start Screen -->
        <div id="wc-start-screen" class="py-8 space-y-6">
          <div class="inline-block p-4 bg-yellow-100 text-yellow-600 rounded-full text-4xl mb-2">
            <i class="fa-solid fa-trophy"></i>
          </div>
          <div>
            <h2 class="text-2xl md:text-3xl font-extrabold text-slate-800">점심 메뉴 이상형 월드컵</h2>
            <p class="text-slate-500 mt-2">두 개의 메뉴 중 더 땡기는 것을 선택하세요!</p>
          </div>
          <button onclick="startWorldcup()" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold text-lg px-8 py-4 rounded-2xl shadow-lg shadow-yellow-500/30 transition transform hover:-translate-y-0.5 active:translate-y-0">
            8강 토너먼트 시작하기 🚀
          </button>
        </div>

        <!-- Worldcup Match Screen -->
        <div id="wc-match-screen" class="hidden">
          <div class="flex justify-between items-center mb-6">
            <span id="wc-round-title" class="font-extrabold text-orange-600 bg-orange-50 px-4 py-1.5 rounded-full text-sm">
              8강 (1/4)
            </span>
            <span class="text-xs text-slate-400 font-semibold">클릭하여 선택</span>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 my-4">
            <!-- Choice 1 -->
            <div id="wc-card-0" onclick="selectCandidate(0)" class="cursor-pointer bg-slate-50 hover:bg-orange-50 border-2 border-slate-100 hover:border-orange-400 p-8 rounded-3xl transition-all duration-200 transform hover:-translate-y-1 shadow-sm hover:shadow-md flex flex-col items-center justify-center min-h-[220px]">
              <div id="wc-icon-0" class="text-6xl mb-3">🍱</div>
              <h3 id="wc-name-0" class="text-2xl font-bold text-slate-800">메뉴 1</h3>
              <p id="wc-tag-0" class="text-sm text-slate-400 mt-1 font-medium">카테고리</p>
            </div>

            <!-- Choice 2 -->
            <div id="wc-card-1" onclick="selectCandidate(1)" class="cursor-pointer bg-slate-50 hover:bg-orange-50 border-2 border-slate-100 hover:border-orange-400 p-8 rounded-3xl transition-all duration-200 transform hover:-translate-y-1 shadow-sm hover:shadow-md flex flex-col items-center justify-center min-h-[220px]">
              <div id="wc-icon-1" class="text-6xl mb-3">🍜</div>
              <h3 id="wc-name-1" class="text-2xl font-bold text-slate-800">메뉴 2</h3>
              <p id="wc-tag-1" class="text-sm text-slate-400 mt-1 font-medium">카테고리</p>
            </div>
          </div>
        </div>

        <!-- Worldcup Result Screen -->
        <div id="wc-result-screen" class="hidden py-6 space-y-6">
          <div class="inline-block p-4 bg-orange-100 text-orange-500 rounded-full text-4xl mb-2 animate-bounce">
            <i class="fa-solid fa-crown"></i>
          </div>
          <div>
            <p class="text-sm font-bold text-orange-500 uppercase tracking-wider">최종 우승 메뉴!</p>
            <h2 id="wc-winner-name" class="text-3xl md:text-4xl font-black text-slate-800 mt-1">우승 메뉴</h2>
            <div id="wc-winner-icon" class="text-7xl my-4">🏆</div>
          </div>

          <div id="wc-map-links" class="flex justify-center space-x-3 max-w-sm mx-auto">
            <a id="wc-link-naver" href="#" target="_blank" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white py-3 px-4 rounded-xl text-sm font-bold flex items-center justify-center space-x-2 transition">
              <span>네이버 지도</span>
              <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
            </a>
            <a id="wc-link-kakao" href="#" target="_blank" class="flex-1 bg-yellow-400 hover:bg-yellow-500 text-slate-900 py-3 px-4 rounded-xl text-sm font-bold flex items-center justify-center space-x-2 transition">
              <span>카카오 맵</span>
              <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
            </a>
          </div>

          <button onclick="startWorldcup()" class="mt-4 bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-6 rounded-xl transition">
            다시 도전하기 🔄
          </button>
        </div>

      </div>
    </section>

    <!-- SECTION 3: MANAGE MENUS -->
    <section id="sec-manage" class="hidden space-y-6">
      
      <!-- Add Menu Form -->
      <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
        <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center space-x-2">
          <i class="fa-solid fa-plus-circle text-orange-500"></i>
          <span>새 메뉴 추가하기</span>
        </h3>
        <form id="add-menu-form" onsubmit="handleAddMenu(event)" class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <input type="text" id="input-name" placeholder="메뉴 이름 (예: 김치찌개)" required class="px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-orange-500 text-sm">
          <select id="input-category" class="px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-orange-500 text-sm">
            <option value="한식">한식</option>
            <option value="중식">중식</option>
            <option value="일식">일식</option>
            <option value="양식">양식</option>
            <option value="분식">분식</option>
            <option value="아시안">아시안</option>
            <option value="패스트푸드">패스트푸드</option>
          </select>
          <input type="text" id="input-price" placeholder="가격대 (예: ~10,000원)" class="px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-orange-500 text-sm">
          <input type="text" id="input-tag" placeholder="특징/태그 (예: 든든해요, 해장)" class="px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-orange-500 text-sm">
          <input type="text" id="input-icon" placeholder="이모지 (예: 🍲)" maxlength="2" class="px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-orange-500 text-sm">
          <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-2.5 rounded-xl transition text-sm">
            메뉴 추가
          </button>
        </form>
      </div>

      <!-- List of Menus -->
      <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-bold text-slate-800 flex items-center space-x-2">
            <i class="fa-solid fa-list text-orange-500"></i>
            <span>메뉴 목록 (<span id="menu-count">0</span>개)</span>
          </h3>
          <button onclick="resetDefaultMenus()" class="text-xs text-slate-400 hover:text-red-500 underline">
            기본 목록으로 초기화
          </button>
        </div>
        
        <div id="menu-list" class="max-h-[400px] overflow-y-auto custom-scrollbar space-y-2 pr-1">
          <!-- Rendered dynamically -->
        </div>
      </div>

    </section>

  </main>

  <script>
    // Initial Menu Data
    const defaultMenus = [
      { id: 1, name: "김치찌개", category: "한식", price: "8,000원대", tag: "든든함 / 해장", icon: "🍲" },
      { id: 2, name: "돈가스", category: "일식", price: "10,000원대", tag: "바삭함 / 인기", icon: "🥩" },
      { id: 3, name: "짜장면 & 짬뽕", category: "중식", price: "8,000원대", tag: "빠름 / 해장", icon: "🍜" },
      { id: 4, name: "제육볶음", category: "한식", price: "9,000원대", tag: "고기 / 든든함", icon: "🥩" },
      { id: 5, name: "햄버거 Set", category: "패스트푸드", price: "7,000원대", tag: "빠름 / 간편", icon: "🍔" },
      { id: 6, name: "초밥", category: "일식", price: "14,000원대", tag: "깔끔함 / 프레시", icon: "🍣" },
      { id: 7, name: "파스타", category: "양식", price: "12,000원대", tag: "분위기 / 데이트", icon: "🍝" },
      { id: 8, name: "떡볶이 & 튀김", category: "분식", price: "6,000원대", tag: "매콤함 / 분식", icon: "🍢" },
      { id: 9, name: "쌀국수", category: "아시안", price: "10,000원대", tag: "시원함 / 해장", icon: "🍜" },
      { id: 10, name: "순대국밥", category: "한식", price: "9,000원대", tag: "뜨끈함 / 해장", icon: "🍲" },
      { id: 11, name: "마라탕", category: "중식", price: "11,000원대", tag: "중독성 / 매콤", icon: "🥘" },
      { id: 12, name: "샌드위치 & 샐러드", category: "양식", price: "8,000원대", tag: "다이어트 / 가벼움", icon: "🥗" },
      { id: 13, name: "부대찌개", category: "한식", price: "9,500원대", tag: "든든함 / 친구랑", icon: "🥘" },
      { id: 14, name: "카레라이스", category: "일식", price: "9,000원대", tag: "고소함 / 무난함", icon: "🍛" },
      { id: 15, name: "비빔밥", category: "한식", price: "8,500원대", tag: "건강함 / 프레시", icon: "🥗" },
      { id: 16, name: "우동 & 소바", category: "일식", price: "8,000원대", tag: "시원함 / 간편", icon: "🍜" }
    ];

    // App State
    let menus = JSON.parse(localStorage.getItem('lunch_menus')) || defaultMenus;
    let selectedCategory = "전체";
    let selectedTag = "전체";
    let isSpinning = false;

    // Worldcup State
    let wcCandidates = [];
    let wcNextRound = [];
    let wcMatchIndex = 0;
    let wcTotalMatches = 0;

    // Save menus to localStorage
    function saveMenus() {
      localStorage.setItem('lunch_menus', JSON.stringify(menus));
      renderMenuList();
    }

    // Reset default menus
    function resetDefaultMenus() {
      if (confirm("모든 메뉴를 초기 상태로 리셋하시겠습니까?")) {
        menus = [...defaultMenus];
        saveMenus();
      }
    }

    // Tab Navigation
    function switchTab(tab) {
      document.getElementById('sec-random').classList.add('hidden');
      document.getElementById('sec-worldcup').classList.add('hidden');
      document.getElementById('sec-manage').classList.add('hidden');

      const tabs = ['random', 'worldcup', 'manage'];
      tabs.forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if(t === tab) {
          btn.className = "flex-1 py-3 font-bold text-sm md:text-base rounded-xl transition-all duration-200 bg-white text-orange-600 shadow-md flex items-center justify-center space-x-2";
        } else {
          btn.className = "flex-1 py-3 font-bold text-sm md:text-base rounded-xl transition-all duration-200 text-slate-600 hover:text-slate-900 flex items-center justify-center space-x-2";
        }
      });

      document.getElementById(`sec-${tab}`).classList.remove('hidden');

      if (tab === 'manage') {
        renderMenuList();
      }
    }

    // Initialize Filters
    function initFilters() {
      const categories = ["전체", "한식", "중식", "일식", "양식", "분식", "아시안", "패스트푸드"];
      const tags = ["전체", "해장", "든든함", "빠름", "매콤함", "가벼움"];

      const catContainer = document.getElementById('category-filters');
      catContainer.innerHTML = categories.map(cat => `
        <button onclick="setCategory('${cat}')" id="cat-btn-${cat}" class="filter-cat-btn text-xs md:text-sm px-3.5 py-1.5 rounded-full font-bold transition-all ${cat === '전체' ? 'bg-orange-500 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
          ${cat}
        </button>
      `).join('');

      const tagContainer = document.getElementById('tag-filters');
      tagContainer.innerHTML = tags.map(tag => `
        <button onclick="setTag('${tag}')" id="tag-btn-${tag}" class="filter-tag-btn text-xs md:text-sm px-3.5 py-1.5 rounded-full font-bold transition-all ${tag === '전체' ? 'bg-amber-500 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
          # ${tag}
        </button>
      `).join('');
    }

    function setCategory(cat) {
      selectedCategory = cat;
      document.querySelectorAll('.filter-cat-btn').forEach(btn => {
        btn.className = "filter-cat-btn text-xs md:text-sm px-3.5 py-1.5 rounded-full font-bold transition-all bg-slate-100 text-slate-600 hover:bg-slate-200";
      });
      document.getElementById(`cat-btn-${cat}`).className = "filter-cat-btn text-xs md:text-sm px-3.5 py-1.5 rounded-full font-bold transition-all bg-orange-500 text-white shadow-sm";
    }

    function setTag(tag) {
      selectedTag = tag;
      document.querySelectorAll('.filter-tag-btn').forEach(btn => {
        btn.className = "filter-tag-btn text-xs md:text-sm px-3.5 py-1.5 rounded-full font-bold transition-all bg-slate-100 text-slate-600 hover:bg-slate-200";
      });
      document.getElementById(`tag-btn-${tag}`).className = "filter-tag-btn text-xs md:text-sm px-3.5 py-1.5 rounded-full font-bold transition-all bg-amber-500 text-white shadow-sm";
    }

    // Filtered Menus
    function getFilteredMenus() {
      return menus.filter(m => {
        const matchCategory = selectedCategory === "전체" || m.category === selectedCategory;
        const matchTag = selectedTag === "전체" || m.tag.includes(selectedTag);
        return matchCategory && matchTag;
      });
    }

    // Spin Slot Animation
    function spinSlot() {
      if (isSpinning) return;
      
      const filtered = getFilteredMenus();
      if (filtered.length === 0) {
        alert("조건에 일치하는 메뉴가 없습니다! 다른 필터를 선택해주세요.");
        return;
      }

      isSpinning = true;
      const btnSpin = document.getElementById('btn-spin');
      const spinIcon = document.getElementById('spin-icon');
      const slotDisplay = document.getElementById('slot-display');

      btnSpin.disabled = true;
      btnSpin.classList.add('opacity-75');
      spinIcon.classList.add('fa-spin');

      document.getElementById('slot-details').classList.add('hidden');
      document.getElementById('map-links').classList.add('hidden');

      let counter = 0;
      const speed = 60;
      const totalSpins = 25;

      const interval = setInterval(() => {
        const randomItem = filtered[Math.floor(Math.random() * filtered.length)];
        document.getElementById('slot-icon').innerText = randomItem.icon || "🍱";
        document.getElementById('slot-name').innerText = randomItem.name;
        document.getElementById('slot-desc').innerText = `${randomItem.category} • ${randomItem.price}`;
        
        slotDisplay.classList.remove('slot-animation');
        void slotDisplay.offsetWidth; // trigger reflow
        slotDisplay.classList.add('slot-animation');

        counter++;
        if (counter >= totalSpins) {
          clearInterval(interval);
          finalizeSpin(randomItem);
        }
      }, speed);
    }

    function finalizeSpin(winner) {
      isSpinning = false;
      const btnSpin = document.getElementById('btn-spin');
      const spinIcon = document.getElementById('spin-icon');
      
      btnSpin.disabled = false;
      btnSpin.classList.remove('opacity-75');
      spinIcon.classList.remove('fa-spin');

      // Populate Details
      document.getElementById('slot-icon').innerText = winner.icon || "🍱";
      document.getElementById('slot-name').innerText = winner.name;
      document.getElementById('slot-desc').innerText = "오늘 점심은 이 메뉴로 어떠세요?";
      document.getElementById('detail-category').innerText = winner.category;
      document.getElementById('detail-price').innerText = winner.price;
      document.getElementById('detail-tag').innerText = winner.tag;

      // Update Map Links
      const encoded = encodeURIComponent(winner.name);
      document.getElementById('link-naver').href = `https://map.naver.com/v5/search/${encoded}`;
      document.getElementById('link-kakao').href = `https://map.kakao.com/link/search/${encoded}`;

      document.getElementById('slot-details').classList.remove('hidden');
      document.getElementById('map-links').classList.remove('hidden');

      // Confetti Effect
      confetti({
        particleCount: 70,
        spread: 60,
        origin: { y: 0.6 }
      });
    }

    // Worldcup Logic
    function startWorldcup() {
      if (menus.length < 8) {
        alert("월드컵을 진행하려면 최소 8개 이상의 메뉴가 등록되어 있어야 합니다.");
        return;
      }

      // Shuffle and pick 8
      const shuffled = [...menus].sort(() => 0.5 - Math.random());
      wcCandidates = shuffled.slice(0, 8);
      wcNextRound = [];
      wcMatchIndex = 0;
      wcTotalMatches = 4; // 8강 = 4경인지

      document.getElementById('wc-start-screen').classList.add('hidden');
      document.getElementById('wc-result-screen').classList.add('hidden');
      document.getElementById('wc-match-screen').classList.remove('hidden');

      renderWorldcupMatch();
    }

    function renderWorldcupMatch() {
      let roundName = "";
      if (wcTotalMatches === 4) roundName = `8강 (${wcMatchIndex + 1}/4)`;
      else if (wcTotalMatches === 2) roundName = `준결승 4강 (${wcMatchIndex + 1}/2)`;
      else if (wcTotalMatches === 1) roundName = `🏆 결승전`;

      document.getElementById('wc-round-title').innerText = roundName;

      const c1 = wcCandidates[wcMatchIndex * 2];
      const c2 = wcCandidates[wcMatchIndex * 2 + 1];

      document.getElementById('wc-icon-0').innerText = c1.icon || "🍱";
      document.getElementById('wc-name-0').innerText = c1.name;
      document.getElementById('wc-tag-0').innerText = `${c1.category} • ${c1.tag}`;

      document.getElementById('wc-icon-1').innerText = c2.icon || "🍜";
      document.getElementById('wc-name-1').innerText = c2.name;
      document.getElementById('wc-tag-1').innerText = `${c2.category} • ${c2.tag}`;
    }

    function selectCandidate(idx) {
      const winner = wcCandidates[wcMatchIndex * 2 + idx];
      wcNextRound.push(winner);
      wcMatchIndex++;

      if (wcMatchIndex >= wcTotalMatches) {
        // Round Finished
        if (wcNextRound.length === 1) {
          showWorldcupWinner(wcNextRound[0]);
        } else {
          wcCandidates = [...wcNextRound];
          wcNextRound = [];
          wcMatchIndex = 0;
          wcTotalMatches = wcCandidates.length / 2;
          renderWorldcupMatch();
        }
      } else {
        renderWorldcupMatch();
      }
    }

    function showWorldcupWinner(winner) {
      document.getElementById('wc-match-screen').classList.add('hidden');
      document.getElementById('wc-result-screen').classList.remove('hidden');

      document.getElementById('wc-winner-name').innerText = winner.name;
      document.getElementById('wc-winner-icon').innerText = winner.icon || "👑";

      const encoded = encodeURIComponent(winner.name);
      document.getElementById('wc-link-naver').href = `https://map.naver.com/v5/search/${encoded}`;
      document.getElementById('wc-link-kakao').href = `https://map.kakao.com/link/search/${encoded}`;

      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.5 }
      });
    }

    // Manage Menus Logic
    function renderMenuList() {
      document.getElementById('menu-count').innerText = menus.length;
      const listContainer = document.getElementById('menu-list');

      if (menus.length === 0) {
        listContainer.innerHTML = `<p class="text-center text-slate-400 py-8 text-sm">등록된 메뉴가 없습니다. 새 메뉴를 추가해보세요!</p>`;
        return;
      }

      listContainer.innerHTML = menus.map((m) => `
        <div class="flex items-center justify-between p-3 bg-slate-50 hover:bg-slate-100/80 rounded-2xl transition border border-slate-100">
          <div class="flex items-center space-x-3">
            <span class="text-2xl">${m.icon || '🍱'}</span>
            <div>
              <div class="flex items-center space-x-2">
                <h4 class="font-bold text-slate-800 text-sm md:text-base">${m.name}</h4>
                <span class="text-[10px] bg-orange-100 text-orange-600 px-2 py-0.5 rounded-full font-bold">${m.category}</span>
              </div>
              <p class="text-xs text-slate-400 mt-0.5">${m.price || '가격미정'} • ${m.tag || '태그없음'}</p>
            </div>
          </div>
          <button onclick="deleteMenu(${m.id})" class="text-slate-300 hover:text-red-500 p-2 transition">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>
      `).join('');
    }

    function handleAddMenu(e) {
      e.preventDefault();
      const name = document.getElementById('input-name').value.trim();
      const category = document.getElementById('input-category').value;
      const price = document.getElementById('input-price').value.trim() || "가격 미정";
      const tag = document.getElementById('input-tag').value.trim() || "추천 메뉴";
      const icon = document.getElementById('input-icon').value.trim() || "🍱";

      if (!name) return;

      const newMenu = {
        id: Date.now(),
        name,
        category,
        price,
        tag,
        icon
      };

      menus.unshift(newMenu);
      saveMenus();

      // Reset Form
      document.getElementById('add-menu-form').reset();
    }

    function deleteMenu(id) {
      menus = menus.filter(m => m.id !== id);
      saveMenus();
    }

    // App Initialization
    window.onload = () => {
      initFilters();
      renderMenuList();
    };
  </script>

</body>
</html>
